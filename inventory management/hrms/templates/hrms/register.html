{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 40px auto;">
    <h2>Register</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
