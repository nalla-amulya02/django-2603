{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<h2>Dashboard</h2>
<div class="grid-4">
    <div class="stat-box">
        <h3>Total Employees</h3>
        <div class="big">{{ total_employees }}</div>
    </div>
    <div class="stat-box">
        <h3>Total Leave Requests</h3>
        <div class="big">{{ total_leaves }}</div>
    </div>
    <div class="stat-box">
        <h3>Approved Leaves</h3>
        <div class="big">{{ approved_leaves }}</div>
    </div>
    <div class="stat-box">
        <h3>Pending Assets</h3>
        <div class="big">{{ pending_assets }}</div>
    </div>
</div>
{% endblock %}
